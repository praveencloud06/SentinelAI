services:
  sks-postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelai-sks-postgres
    environment:
      POSTGRES_DB: sentinelai_knowledge
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_pass
    ports:
      - "5112:5432"
    volumes:
      - sks-postgres-data:/var/lib/postgresql/data

  sks-redis:
    image: redis:7-alpine
    container_name: sentinelai-sks-redis
    ports:
      - "6379:6379"

  sks-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: sentinelai-sks-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  sks-kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: sentinelai-sks-kafka
    depends_on:
      - sks-zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: sks-zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  sks-postgres-data:
