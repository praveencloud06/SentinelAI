server:
  port: 8090

spring:
  application:
    name: sentinelai-knowledge-service
  datasource:
    url: ${SKS_DATASOURCE_URL:jdbc:postgresql://localhost:5111/sentinelai_knowledge}
    username: ${SKS_DATASOURCE_USERNAME:sentinel}
    password: ${SKS_DATASOURCE_PASSWORD:sentinel_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: ${SKS_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

sentinelai:
  knowledge:
    embedding:
      enabled: ${SKS_EMBEDDING_ENABLED:false}
      provider: ${SKS_EMBEDDING_PROVIDER:openrouter}
      model: ${SKS_EMBEDDING_MODEL:text-embedding-3-small}
      dimension: ${SKS_EMBEDDING_DIMENSION:1536}
      batch-size: ${SKS_EMBEDDING_BATCH_SIZE:10}
      async:
        enabled: ${SKS_EMBEDDING_ASYNC_ENABLED:true}
        thread-pool-size: ${SKS_EMBEDDING_THREAD_POOL_SIZE:5}
        queue-capacity: ${SKS_EMBEDDING_QUEUE_CAPACITY:100}
      retry:
        max-attempts: ${SKS_EMBEDDING_RETRY_MAX_ATTEMPTS:3}
        backoff-ms: ${SKS_EMBEDDING_RETRY_BACKOFF_MS:5000}
      chunking:
        enabled: ${SKS_EMBEDDING_CHUNKING_ENABLED:true}
        max-chunk-size: ${SKS_EMBEDDING_CHUNKING_MAX_SIZE:2000}
        chunk-overlap: ${SKS_EMBEDDING_CHUNKING_OVERLAP:200}
      openrouter:
        api-key: ${SKS_OPENROUTER_API_KEY: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}
        base-url: ${SKS_OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      openai:
        api-key: ${SKS_OPENAI_API_KEY:}
        base-url: ${SKS_OPENAI_BASE_URL:https://api.openai.com/v1}
      ollama:
        base-url: ${SKS_OLLAMA_BASE_URL:http://localhost:11434}
      azure-openai:
        api-key: ${SKS_AZURE_OPENAI_API_KEY:}
        endpoint: ${SKS_AZURE_OPENAI_ENDPOINT:}
        deployment-name: ${SKS_AZURE_OPENAI_DEPLOYMENT:}
    ai-engine:
      url: ${SKS_AI_ENGINE_URL:http://localhost:8000}
      embeddings-endpoint: ${SKS_AI_ENGINE_EMBEDDINGS_ENDPOINT:/api/embeddings}
      timeout-ms: ${SKS_AI_ENGINE_TIMEOUT_MS:30000}
    sync:
      scheduled-enabled: ${SKS_SCHEDULED_SYNC_ENABLED:false}
      fixed-delay-ms: ${SKS_SYNC_FIXED_DELAY_MS:900000}
    platforms:
      github:
        enabled: ${SKS_GITHUB_ENABLED:false}
        base-url: ${SKS_GITHUB_BASE_URL:https://api.github.com}
        username: ${SKS_GITHUB_USERNAME:}
        api-token: ${SKS_GITHUB_API_TOKEN:}
        webhook-secret: ${SKS_GITHUB_WEBHOOK_SECRET:}
        webhook-token-header: ${SKS_GITHUB_WEBHOOK_TOKEN_HEADER:x-sentinelai-webhook-token}
        default-tenant-id: ${SKS_GITHUB_TENANT_ID:default}
        repositories:
          - ${SKS_GITHUB_REPOSITORY:sentinelai/api}
      gitlab:
        enabled: ${SKS_GITLAB_ENABLED:false}
        base-url: ${SKS_GITLAB_BASE_URL:https://gitlab.com/api/v4}
        username: ${SKS_GITLAB_USERNAME:}
        api-token: ${SKS_GITLAB_API_TOKEN:}
        webhook-secret: ${SKS_GITLAB_WEBHOOK_SECRET:}
        webhook-token-header: ${SKS_GITLAB_WEBHOOK_TOKEN_HEADER:x-sentinelai-webhook-token}
        default-tenant-id: ${SKS_GITLAB_TENANT_ID:default}
        repositories:
          - ${SKS_GITLAB_REPOSITORY:sentinelai/api}
      jira:
        enabled: ${SKS_JIRA_ENABLED:false}
        base-url: ${SKS_JIRA_BASE_URL:}
        username: ${SKS_JIRA_USERNAME:}
        api-token: ${SKS_JIRA_API_TOKEN:}
        webhook-secret: ${SKS_JIRA_WEBHOOK_SECRET:}
        webhook-token-header: ${SKS_JIRA_WEBHOOK_TOKEN_HEADER:x-sentinelai-webhook-token}
        default-tenant-id: ${SKS_JIRA_TENANT_ID:default}
        project-keys:
          - ${SKS_JIRA_PROJECT_KEY:PAY}
      confluence:
        enabled: ${SKS_CONFLUENCE_ENABLED:false}
        base-url: ${SKS_CONFLUENCE_BASE_URL:}
        username: ${SKS_CONFLUENCE_USERNAME:}
        api-token: ${SKS_CONFLUENCE_API_TOKEN:}
        webhook-secret: ${SKS_CONFLUENCE_WEBHOOK_SECRET:}
        webhook-token-header: ${SKS_CONFLUENCE_WEBHOOK_TOKEN_HEADER:x-sentinelai-webhook-token}
        default-tenant-id: ${SKS_CONFLUENCE_TENANT_ID:default}
        space-keys:
          - ${SKS_CONFLUENCE_SPACE_KEY:ARCH}
      jenkins:
        enabled: ${SKS_JENKINS_ENABLED:false}
        base-url: ${SKS_JENKINS_BASE_URL:}
        username: ${SKS_JENKINS_USERNAME:}
        api-token: ${SKS_JENKINS_API_TOKEN:}
        webhook-secret: ${SKS_JENKINS_WEBHOOK_SECRET:}
        webhook-token-header: ${SKS_JENKINS_WEBHOOK_TOKEN_HEADER:x-sentinelai-webhook-token}
        default-tenant-id: ${SKS_JENKINS_TENANT_ID:default}
        job-names:
          - ${SKS_JENKINS_JOB_NAME:payment-service-deploy}
