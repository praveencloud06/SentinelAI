spring:
  # Disable Spring Boot's Elasticsearch auto-configuration globally.
  # ElkConfig creates the client manually, conditioned on sentinelai.elk.enabled=true.
  # This prevents startup failures when Elasticsearch is not running locally.
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
  datasource:
    # If running Spring Boot on your host:
    url: jdbc:postgresql://localhost:5111/sentinelai
    # If running Spring Boot in a container, use:
    # url: jdbc:postgresql://host.docker.internal:5111/sentinelai
    username: sentinel
    password: sentinel_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3
      embedding:
        model: llama3

logging:
  level:
    root: INFO
    '[com.sentinel.ai]': DEBUG

# Custom application properties
sentinelai:
  limits:
    # Protects providers (e.g., Groq) from oversized requests.
    max-log-chars: 2000
    max-prompt-chars: 3000
  ai-engine:
    # FastAPI engine endpoint (see SentinelAI-AI-Engine)
    url: http://localhost:8000/analyze
    # Default provider for the AI-Engine: groq|ollama|huggingface|openai|openrouter
    provider: openrouter
  semantic-search:
    # Uses Spring AI EmbeddingModel (Ollama) to fetch similar historical incidents.
    # Set to false if you don't have Ollama running locally.
    # Vector similarity search implementation is pluggable (in-memory now; Qdrant/pgvector later).
    enabled: true
  knowledge-service:
    # Disabled by default so RCA continues to work without the SKS microservice.
    enabled: ${SENTINELAI_KNOWLEDGE_SERVICE_ENABLED:true}
    url: ${SENTINELAI_KNOWLEDGE_SERVICE_URL:http://localhost:8090}
    max-timeline-events: ${SENTINELAI_KNOWLEDGE_SERVICE_MAX_TIMELINE_EVENTS:20}
    request-timeout-ms: ${SENTINELAI_KNOWLEDGE_SERVICE_TIMEOUT_MS:3000}
  # ── ELK Investigation ────────────────────────────────────────────────────────
  # Enabled by default for local development.
  # Override enabled: false in environment-specific config for non-dev deployments.
  elk:
    enabled: true
    url: http://localhost:9200
    index: logs-application
    # Maximum number of log documents fetched per investigation request.
    # Keeps AI prompts within token limits.
    max-log-results: 1000
  jira:
    base-url: https://praveend06.atlassian.net/ # Change to your Jira instance URL
    username: praveend06@gmail.com
    api-token: <jira-api-token>
